<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Redirect to index.html and preserve the full path for React Router
      var redirectPath = location.pathname + location.search + location.hash;
      window.location.replace('/index.html?redirect=' + encodeURIComponent(redirectPath));
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>

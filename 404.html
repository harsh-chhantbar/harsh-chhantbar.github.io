<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsh Chhantbar - Portfolio</title>
    <meta name="description" content="An enthusiastic and experienced software engineer, specialising in crafting robust and scalable web applications.">
    <meta name="robots" content="noindex, nofollow">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .redirect {
            color: #333;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="redirect">
        <div class="spinner"></div>
        <p>Redirecting to portfolio...</p>
    </div>

    <script>
        // Handle routing for GitHub Pages with HashRouter
        const path = window.location.pathname;
        
        // Check if this is a blog post
        if (path.startsWith('/blog/')) {
            const blogId = path.split('/blog/')[1];
            // Redirect to hash route for the React app
            window.location.href = `/#/blog/${blogId}`;
        } else {
            // Redirect to main page
            window.location.href = '/';
        }
    </script>
</body>
</html>
